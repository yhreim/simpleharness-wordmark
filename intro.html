<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SimpleHarness · 片头草稿</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#030611;color:#dfe5ef;font-family:Arial,"Microsoft YaHei",sans-serif;display:grid;min-height:100vh;place-content:center}main{position:relative;width:min(100vw,160vh);aspect-ratio:16/9;overflow:hidden;background:#080e24}canvas{position:absolute;width:100%;height:100%}.mark{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:mark 9s both}.bubble{position:absolute;left:19%;right:19%;top:66%;padding:2.4% 2%;text-align:center;border:1px solid #7086d566;border-radius:18px;background:#101a36e8;font-size:clamp(18px,3.1vw,48px);font-weight:700;opacity:0;animation:caption 9s both}.bubble:after{content:"";position:absolute;left:10%;bottom:-10px;width:18px;height:18px;background:#101a36;transform:rotate(45deg);border-right:1px solid #7086d566;border-bottom:1px solid #7086d566}.sub{position:absolute;top:84%;width:100%;text-align:center;color:#9baac6;font-size:clamp(12px,1.35vw,23px);letter-spacing:.12em;opacity:0;animation:caption 9s .45s both}button{position:fixed;right:20px;bottom:16px;background:#15213b;border:1px solid #3b4c70;color:#cbd5e8;padding:9px 16px;border-radius:8px;cursor:pointer}@keyframes mark{0%,17%{opacity:0;transform:scale(1.07)}42%{opacity:1;transform:scale(1)}65%,100%{opacity:1;transform:translateY(-12%) scale(.9)}}@keyframes caption{0%,60%{opacity:0;transform:translateY(14px)}78%,100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.mark{animation:none;opacity:1;transform:translateY(-12%) scale(.9)}.bubble,.sub{animation:none;opacity:1}}
</style>
<main aria-label="SimpleHarness 动态片头"><canvas></canvas><img class="mark" src="wordmark.png" alt="蓝白灰粉色点阵 SimpleHarness 字标"><div class="bubble">从 API 手搓 Harness</div><div class="sub">一串密钥，搭出自己的 AI 助手</div></main><button onclick="location.reload()">重播片头</button>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');c.width=1600;c.height=900;
const dots=Array.from({length:340},(_,i)=>({x:(i*197.37)%1600,y:(i*83.71)%900,r:1+(i%3)*.6,phase:i*.37}));
const start=performance.now();function draw(now){let t=(now-start)/1000;g.clearRect(0,0,1600,900);let fade=Math.max(0,Math.min(1,t/.8,1-(t-1.6)/2));for(const p of dots){g.beginPath();g.fillStyle=`rgba(${p.x>1200?'204,145,183':'100,132,255'},${fade*(.3+.6*Math.pow(Math.sin(t*1.3+p.phase),2))})`;g.shadowColor='#526dff';g.shadowBlur=8;g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill()}if(t<4)requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
